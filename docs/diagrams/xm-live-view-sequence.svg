<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010"><defs><marker id="a-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="a-0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="a-f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f8fafc"/></marker><marker id="a-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="a-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-cbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs><rect width="1600" height="1010" fill="#ffffff"/><text x="40" y="52" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start" xml:space="preserve" >XM live view from outside the house: how the stream reaches the phone</text><text x="40" y="84" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="16" font-weight="normal" fill="#475569" text-anchor="start" xml:space="preserve" >Order of new flows in the state table and capture, 2026-11-03. Nothing is port-forwarded; the camera dials out to everything.</text><rect x="45" y="112" width="210" height="62" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/><text x="150" y="138" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle" xml:space="preserve" >XM camera</text><text x="150" y="160" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle" xml:space="preserve" >home LAN</text><line x1="150" y1="176" x2="150" y2="760" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 6"/><rect x="315" y="112" width="210" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><text x="420" y="138" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle" xml:space="preserve" >Huawei Cloud</text><text x="420" y="160" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle" xml:space="preserve" >SG / SA</text><line x1="420" y1="176" x2="420" y2="760" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 6"/><rect x="575" y="112" width="210" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><text x="680" y="138" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle" xml:space="preserve" >Alibaba Cloud</text><text x="680" y="160" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle" xml:space="preserve" >Singapore</text><line x1="680" y1="176" x2="680" y2="760" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 6"/><rect x="825" y="112" width="210" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><text x="930" y="138" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle" xml:space="preserve" >Huawei Cloud</text><text x="930" y="160" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle" xml:space="preserve" >Hong Kong</text><line x1="930" y1="176" x2="930" y2="760" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 6"/><rect x="1075" y="112" width="210" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><text x="1180" y="138" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle" xml:space="preserve" >UCloud relay</text><text x="1180" y="160" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle" xml:space="preserve" >MY / SG / HK</text><line x1="1180" y1="176" x2="1180" y2="760" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 6"/><rect x="1335" y="112" width="210" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><text x="1440" y="138" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle" xml:space="preserve" >IPCee app</text><text x="1440" y="160" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle" xml:space="preserve" >phone, mobile data</text><line x1="1440" y1="176" x2="1440" y2="760" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 6"/><line x1="156" y1="225" x2="412" y2="225" stroke="#d97706" stroke-width="3" marker-end="url(#a-d97706)"/><text x="164" y="213" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#d97706" text-anchor="start" xml:space="preserve" >1  UDP 8765 keep-alive every ~13 s, device cloud ID in ASCII</text><line x1="156" y1="307" x2="412" y2="307" stroke="#64748b" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#a-64748b)"/><text x="164" y="295" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#475569" text-anchor="start" xml:space="preserve" >2  TCP 6510 control channel, held open</text><line x1="1434" y1="389" x2="428" y2="389" stroke="#64748b" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#a-64748b)"/><text x="434" y="377" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#475569" text-anchor="start" xml:space="preserve" >3  app asks the XM cloud for the camera (phone side not captured)</text><text x="1430" y="413" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="end" xml:space="preserve" font-style="italic">assumed</text><line x1="156" y1="471" x2="672" y2="471" stroke="#64748b" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#a-64748b)"/><text x="164" y="459" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#475569" text-anchor="start" xml:space="preserve" >4  TCP 8386 short session: relay assignment</text><text x="670" y="495" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="end" xml:space="preserve" font-style="italic">assumed</text><line x1="156" y1="553" x2="922" y2="553" stroke="#16a34a" stroke-width="3" marker-end="url(#a-16a34a)"/><text x="164" y="541" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#16a34a" text-anchor="start" xml:space="preserve" >5  UDP 30000, one 72-byte datagram: P2P hole-punch</text><text x="920" y="577" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="end" xml:space="preserve" font-style="italic">no reply  ✗</text><line x1="156" y1="635" x2="1172" y2="635" stroke="#dc2626" stroke-width="5" marker-end="url(#a-dc2626)"/><text x="164" y="623" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#dc2626" text-anchor="start" xml:space="preserve" >6  TCP 6611, no TLS: ~1.26 MB in 42 s (~240 kbit/s)</text><line x1="1186" y1="717" x2="1432" y2="717" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#a-dc2626)"/><text x="1194" y="705" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#dc2626" text-anchor="start" xml:space="preserve" >7  relayed to the phone (leg not captured)</text><text x="1430" y="741" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="end" xml:space="preserve" font-style="italic">assumed</text><rect x="560" y="759" width="620" height="124" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="580" y="787" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="start" xml:space="preserve" >Inside the 6611 stream (XM&#x27;s own framing, not TLS):</text><text x="580" y="812" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="14" font-weight="normal" fill="#dc2626" text-anchor="start" xml:space="preserve" >audio   00 00 01 FA  G.711 A-law  1042 frames  CLEAR</text><text x="580" y="837" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="14" font-weight="normal" fill="#dc2626" text-anchor="start" xml:space="preserve" >P-frame 00 00 01 FD  HEVC TRAIL_R   484 frames  CLEAR</text><text x="580" y="862" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start" xml:space="preserve" >I-frame 00 00 01 FC  no VPS/SPS      10 frames  scrambled</text><line x1="40" y1="980" x2="86" y2="980" stroke="#dc2626" stroke-width="4"/><text x="96" y="985" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" xml:space="preserve" >cleartext media (audio / video)</text><line x1="425" y1="980" x2="471" y2="980" stroke="#d97706" stroke-width="4"/><text x="481" y="985" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" xml:space="preserve" >cleartext signalling or identifiers</text><line x1="810" y1="980" x2="856" y2="980" stroke="#16a34a" stroke-width="4"/><text x="866" y="985" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" xml:space="preserve" >encrypted (TLS, or random-looking)</text><line x1="1195" y1="980" x2="1241" y2="980" stroke="#64748b" stroke-width="4" stroke-dasharray="8 5"/><text x="1251" y="985" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" xml:space="preserve" >proprietary, payload not analysed</text></svg>