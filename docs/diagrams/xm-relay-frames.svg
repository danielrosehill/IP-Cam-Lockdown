ze="30" font-weight="bold" fill="#0f172a" text-anchor="end" xml:space="preserve" >484</text><text x="1430" y="318" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" xml:space="preserve" >frames</text><text x="1170" y="370" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="start" xml:space="preserve" >CLEAR: inter-frames decodable</text><text x="40" y="466" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="start" xml:space="preserve" >I-frame</text><rect x="170" y="434" width="190" height="52" rx="6" fill="#e0e7ff" stroke="#2563eb" stroke-width="1.5"/><text x="265" y="467" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="17" font-weight="bold" fill="#2563eb" text-anchor="middle" xml:space="preserve" >00 00 01 FC</text><rect x="370" y="434" width="150" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/><text x="445" y="466" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle" xml:space="preserve" >header (rest)</text><rect x="530" y="434" width="560" height="52" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="546" y="467" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="15.5" font-weight="normal" fill="#0f172a" text-anchor="start" xml:space="preserve" >?? ?? ?? ?? … (no structure)</text><text x="530" y="510" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#475569" text-anchor="start" xml:space="preserve" >no VPS/SPS start code follows</text><text x="1420" y="458" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0f172a" text-anchor="end" xml:space="preserve" >10</text><text x="1430" y="458" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" xml:space="preserve" >frames</text><text x="1170" y="510" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="start" xml:space="preserve" >SCRAMBLED: the only protected part</text><text x="40" y="590" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start" xml:space="preserve" >Transport: plain TCP to the relay, no TLS handshake. Anyone on the path (the relay operator, transit networks) gets the audio outright;</text><text x="40" y="614" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start" xml:space="preserve" >the video needs only the 10 keyframes recovered. Decoding was not attempted.</text></svg>