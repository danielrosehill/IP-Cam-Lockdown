"bold" fill="#0f172a" text-anchor="start" xml:space="preserve" >What the relay operator sees: XM media frames on TCP 6611</text><text x="40" y="84" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="16" font-weight="normal" fill="#475569" text-anchor="start" xml:space="preserve" >42 s of live view, 1.26 MB camera → UCloud. Byte values shown are the ones read off the capture; grey blocks are header fields not decoded.</text><text x="40" y="186" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="start" xml:space="preserve" >Audio</text><rect x="170" y="154" width="190" height="52" rx="6" fill="#e0e7ff" stroke="#2563eb" stroke-width="1.5"/><text x="265" y="187" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="17" font-weight="bold" fill="#2563eb" text-anchor="middle" xml:space="preserve" >00 00 01 FA</text><rect x="370" y="154" width="70" height="52" rx="6" fill="#e0e7ff" stroke="#2563eb" stroke-width="1.5"/><text x="405" y="187" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="17" font-weight="bold" fill="#2563eb" text-anchor="middle" xml:space="preserve" >0E</text><rect x="450" y="154" width="150" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/><text x="525" y="186" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle" xml:space="preserve" >header (rest)</text><rect x="610" y="154" width="560" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="626" y="187" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="15.5" font-weight="normal" fill="#dc2626" text-anchor="start" xml:space="preserve" >D5 55 D5 55 D5 55 … (A-law silence)</text><text x="610" y="230" font-family="DejaVu Sans, Barlow, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#475569" text-anchor="start" xml:space="preserv